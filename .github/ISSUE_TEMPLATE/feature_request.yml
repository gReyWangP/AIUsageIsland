name: Feature request
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。请尽量说明使用场景和要解决的问题，而不只是实现方式。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 当前哪里不方便，或在什么场景下不够用
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望应用如何表现
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: dropdown
    id: area
    attributes:
      label: 相关区域
      options:
        - 显示形式与布局
        - 平台与账号
        - 用量分析
        - 提醒与推送
        - 设置与更新
        - 其他
